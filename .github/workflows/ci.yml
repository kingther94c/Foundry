name: CI

# Windows only, by design: the path, process, and encoding behaviour Foundry
# depends on cannot be established on another platform, and a green Linux run
# would be a false signal.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch-notes check needs main and the merge base with it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Branch notes
        # DELTA.md: the empty template on main, a written Summary on a branch
        # (AGENT.md, "Branch notes").
        run: python scripts/delta.py check

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        # -X warn_default_encoding surfaces any open() without an explicit
        # encoding, which on a non-UTF-8 console silently corrupts the journal.
        run: python -X warn_default_encoding -m pytest tests -q

  example-earnings-pm:
    # examples/earnings_pm is built with Foundry as a dogfooding exercise; its
    # offline suite runs here so a change to it cannot go red unnoticed.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/earnings_pm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -X warn_default_encoding -m pytest -q

  tools:
    # tools/ is a standalone, stdlib-only package other projects here build on.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -X warn_default_encoding -m pytest -q

  researchos:
    # ResearchOS builds on tools/; its suite runs offline against fake agents.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ResearchOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ../tools -e ".[dev]"

      - name: Test
        run: python -X warn_default_encoding -m pytest -q

  run-from-clone:
    # Only the dependencies are installed: every suite and the CLI run from the
    # source tree, as they do in a fresh clone (docs/decision-log.md D-033).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the dependencies only
        run: python -m pip install -r requirements.in "pytest>=8.0,<9" "anthropic>=1.13,<2"

      - name: Foundry itself is not installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('foundry') is not None)"

      # One command a step: a pwsh step reports only its last command's exit code.
      - name: The launcher
        run: python run-foundry.py --version

      - name: The command wrapper
        run: .\foundry.cmd doctor

      - name: Foundry suite
        run: python -X warn_default_encoding -m pytest tests -q

      - name: tools suite
        working-directory: tools
        run: python -X warn_default_encoding -m pytest -q

      - name: ResearchOS suite
        working-directory: ResearchOS
        run: python -X warn_default_encoding -m pytest -q

  offline-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheelhouse
        run: python scripts/build_wheelhouse.py

      - name: Install from the wheelhouse with no index
        # The real target machine has no package index. A single sdist-only
        # transitive dependency would only fail there, so it fails here first.
        # With requirements.lock, every dependency is installed only if its
        # wheel has the hash the lock pins (D-164); foundry's own wheel, built
        # in this job, after them.
        run: |
          python -m venv fresh
          if (Test-Path requirements.lock) {
            fresh\Scripts\python.exe -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.lock
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            fresh\Scripts\python.exe -m pip install --no-index --find-links wheelhouse --no-deps foundry
          } else {
            fresh\Scripts\python.exe -m pip install --no-index --find-links wheelhouse foundry
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          fresh\Scripts\python.exe -m foundry --version
          fresh\Scripts\python.exe -m foundry doctor
