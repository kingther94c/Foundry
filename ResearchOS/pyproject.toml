[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "researchos"
version = "0.1.0"
description = "Train an analyst agent on masked earnings documents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13,<2",
    "foundry-tools",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.hatch.build.targets.wheel]
packages = ["researchos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::EncodingWarning"]
